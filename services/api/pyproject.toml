[project]
name = "popshot-api"
version = "0.1.0"
description = "Popshot API: data, rules and stats"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popshot_api"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
required-version = ">=0.11.32"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "PT", "RET", "ARG", "DTZ", "PL", "TRY", "BLE", "ASYNC",
]
ignore = ["TRY003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
