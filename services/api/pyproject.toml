[project]
name = "popshot-api"
version = "0.1.0"
description = "Popshot API: data, rules and stats"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "google-genai==2.29.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "pywebpush==2.5.0",
    "sqlalchemy==2.1.4",
    "structlog==26.1.0",
    # Time zone rules for crews' local days (recap.py), whatever the base image has.
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popshot_api"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
required-version = ">=0.11.32"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "N", "C4", "SIM", "RUF", "PT", "RET", "ARG", "DTZ", "PL", "TRY", "BLE", "ASYNC",
]
ignore = ["TRY003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "ARG001", "ARG002"]
# SQL built from constant table and column names, never from input.
"tests/db/**" = ["S101", "S608", "PLR2004", "ARG001"]
"migrations/**" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

# The Web Push libraries ship no type information.
[[tool.mypy.overrides]]
module = ["py_vapid", "pywebpush"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["db: needs a real Postgres (see tests/db/conftest.py)"]
xfail_strict = true
filterwarnings = ["error"]
