version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      web-dev:
        dependency-type: development
      web-runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    groups:
      api-dev:
        dependency-type: development
      api-runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: terraform
    directories: ["/infra/terraform/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      terraform-providers:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
