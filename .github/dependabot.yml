version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    ignore:
      # eslint-plugin-jsx-a11y supports ESLint up to 9 only.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Types must match the Node major we run (see apps/web/.nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web-dev:
        dependency-type: development
      web-runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    groups:
      api-dev:
        dependency-type: development
      api-runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directories: ["/services/api", "/apps/web"]
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
