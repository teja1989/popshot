name: Deploy

# Every merge to main: build and scan images, plan, then wait for your approval in the
# prod environment before anything changes. Keyless: Workload Identity Federation only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.16.4
  TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  build:
    name: Build, scan, push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-plan
    permissions:
      contents: read
      id-token: write
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      api_image: ${{ steps.push.outputs.api_image }}
      web_image: ${{ steps.push.outputs.web_image }}
    steps:
      - id: check
        name: Is deployment set up yet?
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment isn't set up yet (see infra/terraform/bootstrap/README.md). Skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.configured == 'true'
        with:
          persist-credentials: false
      - name: Install Trivy (checksum verified)
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tgz}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" trivy
      - name: Build
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          docker build --pull -t popshot-api:candidate services/api
          docker build --pull -t popshot-web:candidate apps/web
      - name: Scan before pushing
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail
          for image in popshot-api:candidate popshot-web:candidate; do
            "$RUNNER_TEMP/trivy" image \
              --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
              --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - id: auth
        if: steps.check.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SA }}
          token_format: access_token
          access_token_lifetime: 600s
      - id: push
        if: steps.check.outputs.configured == 'true'
        name: Push by commit SHA and run, record digests
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://${REGION}-docker.pkg.dev"
          # Tags are immutable and rebuilds aren't byte-identical, so a re-run on the same
          # commit needs its own tag. Deploys pin the digest, not the tag.
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for name in api web; do
            target="${REPOSITORY}/${name}:${tag}"
            docker tag "popshot-${name}:candidate" "$target"
            docker push "$target"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$target")"
            echo "${name}_image=${digest}" >> "$GITHUB_OUTPUT"
            echo "- ${name}: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          docker logout "https://${REGION}-docker.pkg.dev"

  plan:
    name: Plan (read-only)
    needs: build
    if: needs.build.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod-plan
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_api_image: ${{ needs.build.outputs.api_image }}
      TF_VAR_deploy_service_account: ${{ vars.GCP_DEPLOY_SA }}
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform (checksum verified)
        run: |
          set -euo pipefail
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/$zip" | sha256sum --check --strict
          unzip -q -o "$RUNNER_TEMP/$zip" terraform -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}
      - name: Plan the platform stack
        working-directory: infra/terraform/prod/platform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          # This identity can't create a missing state (Terraform locks to write the
          # empty one even with -lock=false). provision.sh creates it on first setup.
          if ! gcloud storage objects describe "gs://${STATE_BUCKET}/prod/platform/default.tfstate" >/dev/null; then
            echo "::error::No platform state in gs://${STATE_BUCKET}. Run ./infra/provision.sh once, then re-run this workflow."
            exit 1
          fi
          terraform init -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
          # Read-only identity: no state lock. A stale plan is refused at apply time.
          terraform plan -lock=false -out=platform.tfplan
          {
            echo "## Platform plan"
            echo '```'
            terraform show -no-color platform.tfplan | tail -n 200
            echo '```'
            echo "The services stack (Cloud Run web and api) is planned and applied after the"
            echo "database jobs, in the approved job."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-plan
          path: infra/terraform/prod/platform/platform.tfplan
          retention-days: 1

  apply:
    name: Apply and deploy (needs approval)
    needs: [build, plan]
    if: needs.build.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_api_image: ${{ needs.build.outputs.api_image }}
      TF_VAR_web_image: ${{ needs.build.outputs.web_image }}
      TF_VAR_deploy_service_account: ${{ vars.GCP_DEPLOY_SA }}
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      # Who can open /admin. Not a secret, but kept out of the repo; empty means nobody.
      TF_VAR_admin_emails: ${{ vars.POPSHOT_ADMIN_EMAILS }}
      TF_VAR_recap_ai: ${{ vars.POPSHOT_RECAP_AI }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform (checksum verified)
        run: |
          set -euo pipefail
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/$zip" | sha256sum --check --strict
          unzip -q -o "$RUNNER_TEMP/$zip" terraform -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-plan
          path: infra/terraform/prod/platform
      - name: Apply the approved platform plan
        working-directory: infra/terraform/prod/platform
        run: |
          set -euo pipefail
          terraform init -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
          terraform apply platform.tfplan
          # What Firebase Hosting still needs at Cloudflare for our domain (empty once connected).
          records="$(terraform output -json dns_records)"
          if [ "$(echo "$records" | jq 'length')" -gt 0 ]; then
            {
              echo "## DNS records to add at Cloudflare (DNS only, grey cloud)"
              echo "| Name | Type | Value |"
              echo "|---|---|---|"
              echo "$records" | jq -r '.[] | "| \(.name) | \(.type) | `\(.value)` |"'
              echo "See infra/terraform/prod/README.md, \"Our domain\"."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Database bootstrap and migrations (new image, before new code serves)
        run: |
          set -euo pipefail
          gcloud run jobs execute db-bootstrap --project "$PROJECT" --region "$REGION" --wait
          gcloud run jobs execute migrate --project "$PROJECT" --region "$REGION" --wait
      - name: Apply the services stack
        working-directory: infra/terraform/prod/services
        run: |
          set -euo pipefail
          terraform init -lockfile=readonly -backend-config="bucket=${STATE_BUCKET}"
          terraform apply -auto-approve
          echo "Web: $(terraform output -raw web_url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke check
        working-directory: infra/terraform/prod/services
        run: |
          set -euo pipefail
          url="$(terraform output -raw web_url)"
          headers="$(curl -fsS -D - -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "$url/")"
          echo "$headers" | grep -qi '^content-security-policy:.*nonce-'
          echo "$headers" | grep -qi '^strict-transport-security:'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/v1/me")" = "401"
          # The API must not answer from the internet (internal ingress, web-only invoker).
          api_url="$(terraform output -raw api_url)"
          api_status="$(curl -s -o /dev/null -w '%{http_code}' "$api_url/healthz")"
          echo "API from the internet: HTTP ${api_status}"
          case "$api_status" in 2*|3*) echo "The API is reachable from the internet"; exit 1;; esac
          admin_url="$(terraform output -raw admin_api_url)"
          admin_status="$(curl -s -o /dev/null -w '%{http_code}' "$admin_url/healthz")"
          echo "Admin service from the internet: HTTP ${admin_status}"
          case "$admin_status" in 2*|3*) echo "The admin service is reachable from the internet"; exit 1;; esac
          # Through the web app, admin pages answer only to a signed-in admin.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/v1/admin/overview")" = "401"
          echo "Smoke check passed: page served with CSP, /api/v1/me and /api/v1/admin require sign-in, API and admin service not public." >> "$GITHUB_STEP_SUMMARY"
