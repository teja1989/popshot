name: Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    name: Web lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_VERSION: 24.21.0
      NODE_SHA256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js (checksum verified)
        run: |
          set -euo pipefail
          tarball="node-v${NODE_VERSION}-linux-x64.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://nodejs.org/dist/v${NODE_VERSION}/${tarball}"
          echo "${NODE_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/node" --strip-components=1
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end tests
        env:
          CI: "1"
          # The runner's preinstalled Chrome, so no unverified browser download.
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:e2e
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
