name: API

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api

jobs:
  checks:
    name: API lint, types, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # postgres:16, pinned by digest (16.15).
        image: postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          # Throwaway superuser for this job's container only; used once to create the roles.
          POSTGRES_PASSWORD: ci-only-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_VERSION: 0.11.32
      UV_SHA256: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967
      UV_PYTHON_DOWNLOADS: never
      UV_FROZEN: "1"
      HYPOTHESIS_PROFILE: ci
      POPSHOT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv (checksum verified)
        run: |
          set -euo pipefail
          tarball="uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${tarball}"
          echo "${UV_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Set up the database like Cloud SQL
        env:
          PGPASSWORD: ci-only-superuser
        run: |
          set -euo pipefail
          admin_pw="$(openssl rand -hex 24)"
          migrator_pw="$(openssl rand -hex 24)"
          api_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_pw"
          echo "::add-mask::$migrator_pw"
          echo "::add-mask::$api_pw"
          su_url="postgresql://postgres@localhost:5432/postgres"
          # A non-superuser admin with CREATEROLE/CREATEDB, like Cloud SQL's postgres user.
          psql -v ON_ERROR_STOP=1 -v pw="$admin_pw" "$su_url" <<'SQL'
          CREATE ROLE cloud_admin LOGIN CREATEDB CREATEROLE PASSWORD :'pw';
          SQL
          psql -v ON_ERROR_STOP=1 -v migrator_password="$migrator_pw" -v api_password="$api_pw" \
            -f db/local_login_users.sql "$su_url"
          admin_url="postgresql://cloud_admin:${admin_pw}@localhost:5432/postgres"
          POPSHOT_BOOTSTRAP_ADMIN_URL="$admin_url" \
            uv run python -m popshot_api.ops.bootstrap_db --migrator popshot_migrator --api popshot_api
          {
            echo "POPSHOT_BOOTSTRAP_ADMIN_URL=${admin_url}"
            echo "POPSHOT_MIGRATION_DATABASE_URL=postgresql+psycopg://popshot_migrator:${migrator_pw}@localhost:5432/popshot"
            echo "POPSHOT_TEST_APP_DATABASE_URL=postgresql+psycopg://popshot_api:${api_pw}@localhost:5432/popshot"
          } >> "$GITHUB_ENV"
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Types
        run: uv run mypy
      - name: Migrations round trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: Tests (unit and isolation)
        run: uv run pytest
      - name: Audit dependencies
        run: |
          set -euo pipefail
          uv export --no-emit-project --all-groups --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
